name: Uppdatera nyhetsflödet

on:
  schedule:
    - cron: "17 5-21/4 * * *"   # ungefär var fjärde timme dagtid (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hämta nyheter
        run: python3 scripts/fetch_news.py news.json
      - name: Spara och publicera om något ändrats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet news.json; then
            echo "Inga nya nyheter"; exit 0
          fi
          git config user.name "mydkey-nyhetsbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Nyhetsflöde: uppdaterat"
          git pull --rebase --autostash
          git push
          # Pushar med GITHUB_TOKEN startar inte alltid Pages-bygget, så be om det
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
